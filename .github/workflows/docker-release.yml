name: Docker Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing stable SemVer tag, for example v1.2.3'
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.value }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io requires lowercase image names
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.value }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Monkey Head Brewing Website
      - name: Build and push
        uses: dwightmulcahy/repo-template/.github/actions/docker-publish@5d53ef5f4bc64a296c057d6c64ec10e7a0245c39
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
