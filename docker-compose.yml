services:
  mhb-web:
    build: .
    image: ghcr.io/dwightmulcahy/mhb-webpage:${MHB_TAG:-latest}   # pulled from GHCR; `build: .` is the local fallback
    container_name: mhb-web
    restart: unless-stopped
    init: true             # tini as PID 1: forwards SIGTERM so `docker stop` is quick and clean
    ports:
      - "8088:8080"          # host:container — change 8088 if taken on the QNAP
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - TZ=America/Costa_Rica
      - SITE_URL=${SITE_URL:-}   # public address, e.g. https://www.monkeyheadbrewing.com (for SEO links)
      - SECURITY_CONTACT=${SECURITY_CONTACT:-}   # /.well-known/security.txt contact; blank = brewery phone
    volumes:
      - ./data:/data         # taplist.json, events.json, … and uploads/ live here and survive rebuilds
