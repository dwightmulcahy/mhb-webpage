<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>On Tap · Monkey Head</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Full-screen taproom TV: everything scales with screen height. Add ?lang=es for Spanish. */
  html { font-size: 1.5vh; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #3b2717; }
  .frame { height: 100vh; border-radius: 0; padding: 1.6vh; }
  .chalkboard { height: 100%; display: flex; flex-direction: column; padding: 2.4vh 3vw 1.6vh; overflow: hidden; }
  .ch-top { margin: 0 0 1.2vh; padding-bottom: 1vh; }
  .ch-monkeys { width: auto; height: 11vh; }
  .ch-tag { font-size: 2.6rem; margin: 0; }
  .ch-cols { flex: 1; min-height: 0; columns: 3; column-fill: balance; column-gap: 2.6vw; }
  .ch-h { font-size: 2.6rem; margin: .4vh 0 1vh; }
  .ch-name { font-size: 2.1rem; }
  .abv { font-size: 2.1rem; }
  .ch-icon { width: 3.4vh; height: 3.4vh; }
  .ch-meta { font-size: 1.35rem; margin-left: calc(3.4vh + 10px); }
  .ch-beer p { font-size: 1.25rem; margin-left: calc(3.4vh + 10px); }
  .ch-beer { padding: .7vh 0 .9vh; }
  .ch-extras { font-size: 1.2rem; margin-top: .6vh; padding-top: 1vh; }
  .ch-xh { font-size: 1.6rem; }
  .ch-extras p { font-size: 1.3rem; }
  .ch-foot { font-size: 1.5rem; margin-top: 1vh; }
</style>
</head>
<body>
<div class="frame"><div class="chalkboard" id="board"></div></div>
<script src="/i18n.js"></script>
<script src="/taps.js"></script>
<script>
  // Shrink text until the whole list fits on screen (varies with number of beers / TV size)
  function fit() {
    const root = document.documentElement, cols = document.querySelector('.ch-cols'), board = document.getElementById('board');
    let size = 1.5; root.style.fontSize = size + 'vh';
    const over = () => (cols && cols.scrollHeight > cols.clientHeight + 2) || cols.scrollWidth > cols.clientWidth + 2 || board.scrollHeight > board.clientHeight + 2;
    while (over() && size > 0.8) { size -= 0.05; root.style.fontSize = size + 'vh'; }
  }
  let last = null;
  MHB.watch((d) => { last = d; document.getElementById('board').innerHTML = MHB.renderBoard(d, I18N.lang); document.fonts.ready.then(fit); }, null, 30000);
  addEventListener('resize', () => last && fit());
</script>
</body>
</html>
